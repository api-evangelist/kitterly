aid: kitterly
name: Kitterly
description: 'Kitterly, Inc. was a direct-to-consumer craft commerce startup that sold
  knitting and crochet kits, yarn, needles and notions online, and ran a monthly Kit
  Club subscription that shipped members a pattern plus the yarn required to complete
  it. Kitterly was backed by 500 Global (500 Startups) along with Manatt Ventures and
  the Jordan x 2080 accelerator. The company was later consolidated under the Cotton
  Cuts brand, a Chesterfield, Missouri based quilting fabric shop selling designer
  die-cut and pre-cut fabric, threads, patterns and notions, plus quilting memberships
  and the Puzzle Mystery Quilt program, serving roughly 4,000 members across more than
  15 countries. The kitterly.com domain now redirects to cottoncuts.com. The business
  is a consumer retail and subscription commerce operation running on a hosted
  e-commerce platform, and it publishes no public API, developer portal, SDKs or
  machine-readable specifications.'
